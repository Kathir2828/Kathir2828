name: Generate Snake

on:
  schedule:
    # Runs every 6 hours
    - cron: "0 */6 * * *"
  
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Required for GitHub Pages deployment using GITHUB_TOKEN
    permissions:
      contents: write

    steps:
      # Checkout the repository (Updated to v4 to prevent Node deprecation warnings)
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Generates snake SVGs (Light & Dark theme)
      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Kathir2828
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Deploy generated files to the 'output' branch (Updated to v5 to fix Node 20 warning)
      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
